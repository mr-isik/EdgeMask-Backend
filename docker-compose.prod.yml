# ═══════════════════════════════════════════════════════════════
#  EdgeMask Backend — Docker Compose Production Overrides
# ═══════════════════════════════════════════════════════════════
#  Usage:
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
# ═══════════════════════════════════════════════════════════════

services:

  # ─── EdgeMask API (Production) ──────────────────────────────
  api:
    restart: always
    environment:
      APP_ENV: production
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (Production) ────────────────────────────────────
  redis:
    restart: always
    command: >
      redis-server
        --appendonly yes
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Production: don't expose Redis port to host
    ports: !reset []
