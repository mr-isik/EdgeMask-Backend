$kind: http-request
name: Proxy to OpenAI
method: POST
url: '{{baseUrl}}/v1/proxy/openai'
description: 'Scrubs PII from the request body, then forwards it to OpenAI using the customer own API key. Supports streaming (SSE) responses.'
headers:
  - key: Authorization
    value: 'Bearer {{edgemaskApiKey}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "model": "gpt-4o",
      "stream": false,
      "messages": [
        {
          "role": "user",
          "content": "Hello, my name is John Doe and my email is john@example.com. Can you help me?"
        }
      ]
    }
