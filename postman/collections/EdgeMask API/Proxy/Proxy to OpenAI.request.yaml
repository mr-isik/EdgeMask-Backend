$kind: http-request
name: Proxy to OpenAI
method: POST
url: "{{baseUrl}}/v1/proxy/openai"
description: Scrubs PII from the request body, then forwards it to OpenAI using
  the customer own API key. Supports streaming (SSE) responses.
headers:
  Authorization: Bearer {{edgemaskApiKey}}
  Content-Type: application/json
body:
  type: json
  content: >-
    {
      "model": "gpt-3.5-turbo",
      "messages": [
        {
          "role": "user",
          "content": "Saas yazılımlar geliştirirken, GDPR ile HIPAA uyumluluklarının birbirinden ayrıldığı noktalar nelerdir."
        }
      ]
    }
