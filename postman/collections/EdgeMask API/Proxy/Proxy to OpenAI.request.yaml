$kind: http-request
name: Proxy to OpenAI
method: POST
url: "{{baseUrl}}/v1/proxy/openai"
description: Scrubs PII from the request body, then forwards it to OpenAI using
  the customer own API key. Supports streaming (SSE) responses.
headers:
  Authorization: Bearer {{edgemaskApiKey}}
  Content-Type: application/json
body:
  type: json
  content: >-
    {
      "model": "gpt-5.4-mini",
      "stream": false,
      "messages": [
        {
          "role": "user",
          "content": "Hello, my name is John Doe and my phone number is +90 552 332 24 05. Can you help me?"
        }
      ]
    }
